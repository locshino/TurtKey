[package]
name = "turtkey"
version = "0.1.0"
edition = "2021"
authors = ["TurtKey Contributors"]
description = "Cross-platform Vietnamese Input Engine and GUI in Rust, based on OpenKey"
license = "GPL-3.0"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.4"
rfd = "0.17.2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[lib]
name = "turtkey"
path = "src/lib.rs"

[[bin]]
name = "turtkey"
path = "src/main.rs"

[dev-dependencies]
